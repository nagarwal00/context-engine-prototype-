<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Intelligence Framework</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #090d16;
      color: #e2e8f0;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #f8fafc;
    }
    .logo-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: inline-block;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
      width: auto;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .chip-ready { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .chip-partial { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .chip-running { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .chip-not-added { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background: #38bdf8;
      width: 0%;
      transition: width 0.3s ease;
    }
    .text-muted { color: #94a3b8; font-size: 11px; }
    .text-center { text-align: center; }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .user-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-row">
      <span class="logo-badge"></span>
      <span>CIF Context Engine</span>
    </div>
    <div id="user-section"></div>
  </div>

  <div id="main-content">
    <div class="text-center text-muted" style="padding: 24px 0;">Loading extension state...</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
