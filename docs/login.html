<!doctype html>
<html lang="en">

<head>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com;">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Account Sign-In &amp; Register — Context Engine</title>
  <script src="cif-mode.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    .login-page-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse 60% 60% at 50% 30%, rgba(26, 17, 28, 0.75), transparent 100%), #08090c;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 460px;
      background: #0f1015;
      border: 1px solid #36323d;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-header-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(208, 33, 62, 0.12);
      color: #ff9cac;
      margin-bottom: 18px;
      border: 1px solid rgba(208, 33, 62, 0.25);
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
    }

    .login-box p.intro {
      margin: 0 0 20px;
      color: #9ea0aa;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .privacy-callout {
      margin-top: 20px;
      padding: 12px 14px;
      background: rgba(16, 17, 22, 0.6);
      border: 1px solid #23242c;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #7f818d;
      line-height: 1.45;
      text-align: left;
    }

    .privacy-callout strong {
      color: #b7b8c2;
    }

    .demo-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2f303a;
      text-decoration: none;
      margin-top: 10px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .demo-action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #555768;
      color: #fff;
    }
  </style>
</head>

<body class="login-page-body">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Context Engine home">
      <span class="brand-mark" aria-hidden="true"><img src="assets/logo.png" alt="" class="brand-logo-img" /></span>
      <span class="brand-name">Context Engine</span>
    </a>
    <div></div>
    <a class="button button-outline header-cta" href="index.html">← Back to Home</a>
  </header>

  <main class="login-container">
    <div class="login-box">
      <div class="login-header-logo">
        <img src="assets/logo.png" alt="Context Engine" style="width: 32px; height: 32px; object-fit: contain;" />
      </div>

      <h1>Account sign-in</h1>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="signin">Sign In</button>
        <button type="button" class="auth-tab" data-tab="register">Register</button>
      </div>

      <form id="page-auth-form" class="auth-form" onsubmit="return false;">
        <div class="auth-field">
          <label for="page-username">Username or Email</label>
          <input type="text" id="page-username" name="username" placeholder="e.g. developer" required
            autocomplete="username" />
        </div>
        <div class="auth-field">
          <label for="page-password">Password</label>
          <input type="password" id="page-password" name="password" placeholder="••••••••" required
            autocomplete="current-password" />
        </div>
        <button type="submit" id="page-auth-submit" class="button button-primary"
          style="width: 100%; margin-top: 10px;">Sign in</button>
        <div id="page-auth-msg" class="auth-msg hidden"></div>
      </form>

      <a href="/auth/demo/login" class="demo-action-btn"
        onclick="if(window.CIF_IS_STATIC()){event.preventDefault();try{localStorage.setItem('cif_authenticated','true');localStorage.setItem('cif_user',JSON.stringify({login:'demo-developer',user_id:1,role:'developer'}));}catch(_){}window.location.href=(new URLSearchParams(window.location.search).get('next')||'dashboard.html');}">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width: 14px; height: 14px;">
          <path
            d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.25 8.75l-4 2.5a.75.75 0 0 1-1.15-.65v-5.2a.75.75 0 0 1 1.15-.65l4 2.5a.75.75 0 0 1 0 1.5z" />
        </svg>
        Sign in as Demo Developer
      </a>

      <div class="privacy-callout">
        <strong>Pre-persistence Redaction:</strong> All data is scrubbed by CIF's multi-pattern privacy engine before
        storage. Secrets and tokens are never persisted.
      </div>

      <div class="auth-card-footer">
        <span style="color: #64748b; font-size: 0.8rem;">Authentication required to access workspace</span>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const isStaticDeployment = () => {
        return window.CIF_IS_STATIC();
      };

      const urlParams = new URLSearchParams(window.location.search);
      const nextTarget = urlParams.get('next') || 'dashboard.html';
      const ghBtn = document.getElementById('github-login-btn');
      if (ghBtn) {
        if (!isStaticDeployment()) {
          // The server only accepts same-site paths starting with '/' (open-redirect protection);
          // the default 'dashboard.html' had no slash, so this button was always refused (HTTP 400).
          const ghNext = nextTarget.startsWith('/') ? nextTarget : '/' + nextTarget;
          ghBtn.href = '/auth/github/login?next=' + encodeURIComponent(ghNext);
        } else {
          ghBtn.href = 'javascript:void(0)';
        }
      }
      const demoBtn = document.querySelector('.demo-action-btn');
      if (demoBtn) {
        if (!isStaticDeployment()) {
          demoBtn.href = '/auth/demo/login?next=' + encodeURIComponent(nextTarget);
        } else {
          demoBtn.href = 'javascript:void(0)';
        }
      }

      const authTabs = document.querySelectorAll('.auth-tab');
      const authForm = document.getElementById('page-auth-form');
      const authSubmit = document.getElementById('page-auth-submit');
      const authMsg = document.getElementById('page-auth-msg');

      // GitHub sign-in failures return here as ?auth_error=CODE (set by the server); show the reason in
      // the existing message box. Codes only — no server text is reflected into the page.
      const authErrorMessages = {
        GITHUB_NOT_CONFIGURED: 'GitHub sign-in is not configured on this server yet. Use the account form or the Demo Developer button.',
        ACCESS_DENIED: 'GitHub sign-in was cancelled.',
        INVALID_STATE: 'That GitHub sign-in link is no longer valid. Please try again.',
        STATE_EXPIRED: 'The GitHub sign-in took too long. Please try again.',
        INVALID_CODE: 'GitHub rejected the sign-in code (it may have expired). Please try again.',
        CALLBACK_MISMATCH: "The server's callback URL does not match the GitHub OAuth app settings. Ask the administrator to fix the Authorization callback URL.",
        INVALID_APP_CREDENTIALS: "GitHub rejected this server's OAuth credentials (client ID / secret).",
        GITHUB_UNAVAILABLE: 'Could not reach GitHub. Check your connection and try again.',
        PROFILE_FAILED: 'Your GitHub profile could not be read. Please try again.',
        SESSION_FAILED: 'Signed in at GitHub, but the session could not be created. Please try again.',
        INVALID_NEXT: 'The sign-in link was invalid. Please start again from this page.'
      };
      const authErrorCode = new URLSearchParams(window.location.search).get('auth_error');
      if (authErrorCode && authMsg) {
        authMsg.className = 'auth-msg error';
        authMsg.textContent = authErrorMessages[authErrorCode] || 'GitHub sign-in failed. Please try again.';
      }
      let currentMode = 'signin';

      const handleStaticSuccess = (user, redirectUrl) => {
        const u = user || { login: 'developer', user_id: 1, role: 'developer' };
        try {
          localStorage.setItem('cif_user', JSON.stringify(u));
          localStorage.setItem('cif_authenticated', 'true');
        } catch (_) { }
        if (authMsg) {
          authMsg.className = 'auth-msg success';
          authMsg.textContent = 'Signed in successfully! Redirecting to workspace...';
        }
        window.setTimeout(() => {
          window.location.href = redirectUrl || nextTarget || 'dashboard.html';
        }, 350);
      };

      if (demoBtn) {
        demoBtn.addEventListener('click', (e) => {
          if (isStaticDeployment()) {
            e.preventDefault();
            handleStaticSuccess({ login: 'demo-developer', user_id: 1, role: 'developer' });
          }
        });
      }

      if (ghBtn) {
        ghBtn.addEventListener('click', (e) => {
          if (isStaticDeployment()) {
            e.preventDefault();
            handleStaticSuccess({ login: 'github-developer', user_id: 1, role: 'developer' });
          }
        });
      }

      authTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          authTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentMode = tab.dataset.tab;
          if (authSubmit) {
            authSubmit.textContent = currentMode === 'register' ? 'Create Account & Sign In' : 'Sign in';
          }
          if (authMsg) {
            authMsg.className = 'auth-msg hidden';
            authMsg.textContent = '';
          }
        });
      });

      if (authForm) {
        authForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const usernameInput = document.getElementById('page-username');
          const passwordInput = document.getElementById('page-password');
          const username = usernameInput ? usernameInput.value.trim() : '';
          const password = passwordInput ? passwordInput.value : '';

          if (!username) {
            if (authMsg) {
              authMsg.className = 'auth-msg error';
              authMsg.textContent = 'Please enter a username or email.';
            }
            return;
          }

          if (authSubmit) {
            authSubmit.disabled = true;
            authSubmit.textContent = 'Please wait...';
          }

          try {
            const endpoint = currentMode === 'register' ? '/auth/register' : '/auth/login';
            let res = null;
            let data = null;
            try {
              res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  username: username,
                  password: password,
                  action: currentMode
                })
              });
              data = await res.json();
            } catch (_) { }

            if (res && res.ok && data && data.status === 'success') {
              if (authMsg) {
                authMsg.className = 'auth-msg success';
                authMsg.textContent = data.message || 'Success! Redirecting to workspace...';
              }
              const urlParams = new URLSearchParams(window.location.search);
              const nextUrl = urlParams.get('next') || data.redirect || 'dashboard.html';
              try {
                localStorage.setItem('cif_user', JSON.stringify(data.user || { login: username, user_id: 1 }));
                localStorage.setItem('cif_authenticated', 'true');
              } catch (_) { }
              window.setTimeout(() => {
                window.location.href = nextUrl;
              }, 400);
            } else if (isStaticDeployment() || !res || res.status === 404 || res.status === 405 || !window.location.port.match(/^(8080|8000)$/)) {
              handleStaticSuccess({ login: username, user_id: 1, role: 'developer' });
            } else {
              if (data && data.message) {
                if (authMsg) {
                  authMsg.className = 'auth-msg error';
                  authMsg.textContent = data.message;
                }
                if (authSubmit) {
                  authSubmit.disabled = false;
                  authSubmit.textContent = currentMode === 'register' ? 'Create Account & Sign In' : 'Sign in';
                }
              } else {
                handleStaticSuccess({ login: username, user_id: 1, role: 'developer' });
              }
            }
          } catch (err) {
            handleStaticSuccess({ login: username, user_id: 1, role: 'developer' });
          }
        });
      }

      // Static preview only: the browser flag stands in for a session. In live mode the server
      // session (checked via /api/me below) is the only truth — trusting this flag there caused a
      // login <-> dashboard redirect loop (audit FE-01).
      if (isStaticDeployment()) try {
        const stored = localStorage.getItem('cif_user');
        const isAuth = localStorage.getItem('cif_authenticated');
        if (stored && isAuth === 'true') {
          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get('next') || 'dashboard.html';
          window.location.href = nextUrl;
          return;
        }
      } catch (_) { }

      if (!isStaticDeployment()) fetch('/api/me')  // no backend exists in the static snapshot
        .then(res => {
          if (res.ok) {
            const urlParams = new URLSearchParams(window.location.search);
            const nextUrl = urlParams.get('next') || 'dashboard.html';
            window.location.href = nextUrl;
          }
        })
        .catch(() => { });
    })();
  </script>
</body>

</html>
